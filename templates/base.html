<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SimploGestão{% endblock %}</title>
    <style>
        :root {
            --roxo-sidebar: #3b1978;
            --roxo-principal: #6c35de;
            --roxo-hover: #5624be;
            --fundo-externo: #eef0f7;
            --fundo-painel: #f5f4fa;
            --card-bg: #ffffff;
            --texto-principal: #1e2430;
            --texto-secundario: #667085;
            --borda-suave: #e2e5ee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: var(--fundo-externo);
            color: var(--texto-principal);
            min-height: 100vh;
            padding: 20px;
        }

        .app-shell {
            max-width: 1280px;
            min-height: calc(100vh - 40px);
            margin: 0 auto;
            background: var(--fundo-painel);
            border-radius: 18px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 14px 36px rgba(30, 36, 48, 0.12);
        }

        .sidebar {
            width: 230px;
            background: linear-gradient(180deg, #431c88 0%, #2d115e 100%);
            color: #ffffff;
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
            padding: 0 10px 22px 10px;
            letter-spacing: 0.3px;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-link {
            display: block;
            padding: 11px 14px;
            border-radius: 10px;
            color: #ebe6f7;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            font-weight: bold;
        }

        .sidebar-footer {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
        }

        .sidebar-footer .role {
            color: #d6ccf0;
            margin-top: 2px;
            margin-bottom: 10px;
        }

        .logout-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 7px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            text-decoration: none;
            font-size: 12px;
        }

        .main-area {
            flex: 1;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-header h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--borda-suave);
            border-radius: 14px;
            padding: 20px;
        }

        .card h2 {
            font-size: 17px;
            margin-bottom: 14px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 20px;
            align-items: start;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--texto-secundario);
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--borda-suave);
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--roxo-principal);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: var(--roxo-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            text-align: left;
            color: var(--texto-secundario);
            font-weight: 600;
            padding: 10px 8px;
            border-bottom: 1px solid var(--borda-suave);
        }

        td {
            padding: 11px 8px;
            border-bottom: 1px solid #f0f2f7;
        }

        @media (max-width: 900px) {
            .app-shell {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div>
                <div class="brand">SimploGestão</div>
                <nav class="nav-list">
                    <a href="/clientes" class="nav-link {% if active_page == 'clientes' %}active{% endif %}">Clientes</a>
                    <a href="/produtos" class="nav-link {% if active_page == 'produtos' %}active{% endif %}">Produtos</a>
                    <a href="/vendas" class="nav-link {% if active_page == 'vendas' %}active{% endif %}">Vendas</a>
                </nav>
            </div>
            <div class="sidebar-footer">
                <div><strong>Operador</strong></div>
                <div class="role">Ambiente Local</div>
                <a href="/clientes" class="logout-btn">Atualizar Painel</a>
            </div>
        </aside>

        <main class="main-area">
            <div class="top-header">
                <h1>{% block page_title %}SimploGestão{% endblock %}</h1>
            </div>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
