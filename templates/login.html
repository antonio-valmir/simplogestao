<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — SimploGestão</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <h1>SimploGestão</h1>
      <p>Acesse sua conta para gerenciar sua operação.</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-list">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autofocus placeholder="seu@email.com" value="{{ email_preenchido or '' }}" />
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required placeholder="Digite sua senha" />
      </div>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
    <div class="auth-footer">
      <a href="{{ url_for('auth.esqueci_senha') }}">Esqueci minha senha</a>
    </div>
  </div>
</body>
</html>
